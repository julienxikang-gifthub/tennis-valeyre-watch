name: Tennis morning watch

on:
  schedule:
    # Backup only: GitHub has been starting this 7-8 h late, and a start after 10:00 Paris does nothing.
    - cron: "7 4 * * *"  # 05:07 Paris in winter, 06:07 in summer; the script waits until 06:00 Paris
  # Main start: an outside timer (cron-job.org) calls the dispatch API at 05:50 Paris with inputs.test = "false".
  workflow_dispatch:
    inputs:
      test:
        description: "Single poll + test notification"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: morning-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Europe/Paris
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ONLY_DATES: "13/11/2026 14/11/2026"  # first = priority, rest = backups; empty = no court alerts
      RELEASE_NOTIFY_UNTIL: "2026-11-08"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch
        run: python morning.py ${{ inputs.test && '--test' || '' }}
      - name: Save logs
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "tennis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Morning log $(date +%F)" || exit 0
          git pull --rebase && git push
